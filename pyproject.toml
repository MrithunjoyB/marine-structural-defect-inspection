[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "structvision"
version = "1.0.0"
description = "Write-free local API for the frozen StructVision classical anomaly-proposal baseline"
readme = "README.md"
requires-python = ">=3.9"
authors = [{name = "Mrithunjoy Basumatary"}]
dependencies = [
  "numpy>=1.26.0",
  "opencv-python>=4.9.0.80; python_version < '3.12'",
  "opencv-python-headless>=4.9.0.80; python_version >= '3.12'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "build>=1.2"]

# PEP 735 keeps the heavyweight learned environment outside ``pip install .``.
# Install this group in the dedicated Python 3.12 environment, then install the
# local package with ``--no-deps`` after the complete lock. The Python 3.12
# package marker agrees with Anomalib's headless OpenCV distribution, while the
# existing Python 3.9 core environment retains desktop OpenCV.
[dependency-groups]
normal-feature = [
  "anomalib==2.5.1",
  "torch==2.9.1",
  "torchvision==0.24.1",
  "numpy==2.2.6",
  "opencv-python-headless==4.12.0.88",
  "scikit-learn==1.7.2",
  "safetensors==0.8.0",
  "timm==1.0.28",
]

[tool.setuptools]
packages = ["structvision", "structvision.normal_feature", "scientific_contract"]
package-dir = {structvision = "src/structvision", scientific_contract = "scientific_contract"}
py-modules = ["preprocess", "feature_extraction", "region_proposal", "scoring"]
